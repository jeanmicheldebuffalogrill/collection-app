<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wishlist & Collection</title>

  <!-- PWA & Icône iPhone -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Collection">

  <!-- Scanner de code-barres -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body { 
      background: var(--bg); 
      color: var(--text); 
      padding: 12px; 
      display: flex; 
      justify-content: center;
      padding-top: env(safe-area-inset-top, 12px);
      padding-bottom: env(safe-area-inset-bottom, 12px);
    }
    
    .container { 
      width: 100%; 
      max-width: 500px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header-bar h1 { font-size: 1.25rem; }
    .btn-backup {
      padding: 6px 10px;
      font-size: 0.78rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
    }

    /* Onglets */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 8px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 6px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.82rem;
      text-align: center;
    }
    .tab-btn.active { background: var(--accent); color: var(--text); border-color: var(--accent); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Résumés */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .summary-card.confirmed { border-color: rgba(16, 185, 129, 0.4); }
    .summary-card.pending { border-color: rgba(245, 158, 11, 0.4); }
    .summary-card.value { border-color: rgba(168, 85, 247, 0.4); }
    .summary-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px; }
    .summary-amount { font-size: 1.05rem; font-weight: 700; }
    .amount-confirmed { color: var(--green); }
    .amount-pending { color: var(--amber); }
    .amount-value { color: var(--purple); }

    /* Modal Caméra */
    #scanner-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }
    #scanner-container { width: 100%; max-width: 380px; background: #000; border-radius: 8px; overflow: hidden; }
    .btn-close-scan {
      margin-top: 15px;
      background: var(--red);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Formulaires */
    form {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 12px;
      width: 100%;
    }

    .form-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .form-row > * {
      flex: 1;
      min-width: 0;
    }

    input, select, button {
      padding: 9px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 0.88rem;
      width: 100%;
    }

    .input-with-btn {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    .input-with-btn input {
      padding-right: 42px;
      width: 100%;
    }
    .input-with-btn .btn-inside {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 30px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #334155;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .input-with-btn.btn-text input {
      padding-right: 68px;
    }
    .input-with-btn.btn-text .btn-inside {
      width: auto;
      padding: 0 8px;
      font-size: 0.75rem;
      font-weight: 600;
      background: #312e81;
      color: #c7d2fe;
    }

    button.btn-add {
      background: var(--accent);
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 10px;
    }

    /* Filtres */
    .controls { display: flex; gap: 8px; margin-bottom: 10px; width: 100%; }
    .controls select { flex: 1; padding: 8px; font-size: 0.82rem; }

    /* Cartes */
    .item-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .item-info { min-width: 0; flex: 1; }
    .item-info h3 { 
      font-size: 0.92rem; 
      margin-bottom: 3px; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
    }
    .item-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .badge { padding: 2px 5px; border-radius: 4px; font-size: 0.68rem; background: #312e81; color: #c7d2fe; }

    .market-links {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      padding-top: 5px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .btn-market {
      font-size: 0.7rem;
      padding: 3px 6px;
      border-radius: 4px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: #93c5fd;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .btn-market.pricecharting { color: #a78bfa; border-color: #5b21b6; }
    
    .actions { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      cursor: pointer;
      padding: 5px 7px;
      border-radius: 5px;
      font-size: 0.78rem;
      color: var(--text-muted);
      width: auto;
    }
    .btn-transfer { border-color: rgba(16, 185, 129, 0.4); color: var(--green); }
    .btn-delete { color: var(--red); }
  </style>
</head>
<body>

<div class="container">

  <!-- Scanner Modal -->
  <div id="scanner-modal">
    <div id="scanner-container">
      <div id="reader"></div>
    </div>
    <button class="btn-close-scan" onclick="stopScanner()">Fermer le scan</button>
  </div>

  <div class="header-bar">
    <h1>Mes Listes & Collection</h1>
    <div style="display: flex; gap: 6px;">
      <button class="btn-backup" onclick="exportData()">💾 Sauvegarder</button>
      <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 Charger</button>
      <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('wishlist')">🎯 Wishlist</button>
    <button class="tab-btn" onclick="switchTab('collection')">📦 Collection (<span id="collectionCount">0</span>)</button>
  </div>

  <!-- WISHLIST -->
  <div id="tab-wishlist" class="tab-content active">
    <div class="summary-grid">
      <div class="summary-card confirmed">
        <div class="summary-label">Total prévu</div>
        <div class="summary-amount amount-confirmed" id="totalConfirmed">0,00 €</div>
      </div>
      <div class="summary-card pending">
        <div class="summary-label">Total potentiel</div>
        <div class="summary-amount amount-pending" id="totalPotential">0,00 €</div>
      </div>
    </div>

    <form id="wishlistForm">
      <div class="input-with-btn">
        <input type="text" id="w-title" placeholder="Nom du jeu, vinyle, vêtement..." required>
        <button type="button" class="btn-inside" title="Scanner le code-barres" onclick="startScanner('w-title')">📷</button>
      </div>

      <div class="form-row">
        <select id="w-platform" required>
          <option value="PS5">PlayStation 5</option>
          <option value="Switch">Nintendo Switch</option>
          <option value="Switch 2">Nintendo Switch 2</option>
          <option value="3DS">3DS</option>
          <option value="DS">DS</option>
          <option value="GBA">Game Boy Advance</option>
          <option value="GBC">Game Boy Color</option>
          <option value="Vinyle">🎵 Vinyle</option>
          <option value="Blu-ray">🎬 Blu-ray / 4K</option>
          <option value="Vêtement">👕 Vêtement</option>
          <option value="Autre">📦 Autre</option>
        </select>
        
        <div class="input-with-btn btn-text">
          <input type="number" id="w-price" placeholder="Prix (€)" step="0.01">
          <button type="button" class="btn-inside" onclick="fetchPriceChartingEstimate('w-title', 'w-platform')">🔍 Cote</button>
        </div>
      </div>

      <div class="form-row">
        <input type="date" id="w-releaseDate">
        <select id="w-status">
          <option value="À prendre">✅ Je prends</option>
          <option value="En réflexion">⏳ En réflexion</option>
          <option value="Je passe">❌ Je passe</option>
        </select>
      </div>

      <button type="submit" class="btn-add">+ Ajouter à la wishlist</button>
    </form>

    <div class="controls">
      <select id="w-filterPlatform">
        <option value="all">Tous les supports</option>
        <option value="PS5">PS5</option>
        <option value="Switch">Switch</option>
        <option value="Switch 2">Switch 2</option>
        <option value="3DS">3DS</option>
        <option value="DS">DS</option>
        <option value="GBA">GBA</option>
        <option value="GBC">GBC</option>
        <option value="Vinyle">Vinyles</option>
        <option value="Blu-ray">Blu-ray</option>
        <option value="Vêtement">Vêtements</option>
      </select>
      <select id="w-filterStatus">
        <option value="all">Tous les statuts</option>
        <option value="À prendre">Je prends</option>
        <option value="En réflexion">En réflexion</option>
        <option value="Je passe">Je passe</option>
      </select>
    </div>

    <div id="wishlistContainer"></div>
  </div>

  <!-- COLLECTION -->
  <div id="tab-collection" class="tab-content">
    <div class="summary-grid">
      <div class="summary-card value">
        <div class="summary-label">Valeur totale</div>
        <div class="summary-amount amount-value" id="collectionTotalValue">0,00 €</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Objets possédés</div>
        <div class="summary-amount" id="collectionItemTotal">0</div>
      </div>
    </div>

    <form id="collectionForm">
      <div class="input-with-btn">
        <input type="text" id="c-title" placeholder="Nom de l'objet possédé" required>
        <button type="button" class="btn-inside" title="Scanner le code-barres" onclick="startScanner('c-title')">📷</button>
      </div>

      <div class="form-row">
        <select id="c-platform" required>
          <option value="PS5">PlayStation 5</option>
          <option value="Switch">Nintendo Switch</option>
          <option value="Switch 2">Nintendo Switch 2</option>
          <option value="3DS">3DS</option>
          <option value="DS">DS</option>
          <option value="GBA">Game Boy Advance</option>
          <option value="GBC">Game Boy Color</option>
          <option value="Vinyle">🎵 Vinyle</option>
          <option value="Blu-ray">🎬 Blu-ray / 4K</option>
          <option value="Vêtement">👕 Vêtement</option>
          <option value="Autre">📦 Autre</option>
        </select>
        
        <div class="input-with-btn btn-text">
          <input type="number" id="c-price" placeholder="Valeur (€)" step="0.01">
          <button type="button" class="btn-inside" onclick="fetchPriceChartingEstimate('c-title', 'c-platform')">🔍 Cote</button>
        </div>
      </div>

      <select id="c-state" required>
        <option value="Sous blister / Neuf">✨ Sous blister / Neuf</option>
        <option value="Pas encore joué / Jamais écouté / Non vu">⏳ Non fait / Non écouté</option>
        <option value="En cours / Déjà utilisé">🎮 En cours / Utilisé</option>
        <option value="Terminé / Utilisé">🏆 Terminé</option>
      </select>

      <button type="submit" class="btn-add">+ Ajouter à ma collection</button>
    </form>

    <div class="controls">
      <select id="c-filterPlatform">
        <option value="all">Tous les supports</option>
        <option value="PS5">PS5</option>
        <option value="Switch">Switch</option>
        <option value="Switch 2">Switch 2</option>
        <option value="3DS">3DS</option>
        <option value="DS">DS</option>
        <option value="GBA">GBA</option>
        <option value="GBC">GBC</option>
        <option value="Vinyle">Vinyles</option>
        <option value="Blu-ray">Blu-ray</option>
        <option value="Vêtement">Vêtements</option>
      </select>
      <select id="c-filterState">
        <option value="all">Tous les états</option>
        <option value="Sous blister / Neuf">✨ Neuf</option>
        <option value="Pas encore joué / Jamais écouté / Non vu">⏳ Non fait</option>
        <option value="En cours / Déjà utilisé">🎮 En cours</option>
        <option value="Terminé / Utilisé">🏆 Terminé</option>
      </select>
    </div>

    <div id="collectionContainer"></div>
  </div>

</div>

<script>
  let wishlist = JSON.parse(localStorage.getItem('app_wishlist_v4')) || [];
  let collection = JSON.parse(localStorage.getItem('app_collection_v4')) || [];
  let html5QrCode = null;
  let targetInputId = null;

  function formatMoney(amount) {
    return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(amount || 0);
  }

  function saveData() {
    localStorage.setItem('app_wishlist_v4', JSON.stringify(wishlist));
    localStorage.setItem('app_collection_v4', JSON.stringify(collection));
    renderWishlist();
    renderCollection();
  }

  // --- RECHERCHE COTE & ARGUS ---
  function fetchPriceChartingEstimate(titleFieldId, platformFieldId) {
    const title = document.getElementById(titleFieldId).value.trim();
    const platform = document.getElementById(platformFieldId).value;
    if (!title) {
      alert("Veuillez d'abord saisir le nom du titre.");
      return;
    }
    const query = encodeURIComponent(`${title} ${platform}`);
    window.open(`https://www.pricecharting.com/search-products?type=prices&q=${query}`, '_blank');
  }

  // --- SCANNER DE CODE-BARRES ---
  function startScanner(targetField) {
    targetInputId = targetField;
    document.getElementById('scanner-modal').style.display = 'flex';

    html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      async (decodedText) => {
        stopScanner();
        const inputField = document.getElementById(targetInputId);
        inputField.value = "Recherche...";

        const cleanCode = decodedText.trim();
        let foundTitle = null;

        try {
          const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${cleanCode}.json`);
          const data = await res.json();
          if (data.status === 1 && data.product && data.product.product_name) {
            foundTitle = data.product.product_name;
          }
        } catch (e) {}

        if (!foundTitle) {
          try {
            const resMusic = await fetch(`https://musicbrainz.org/ws/2/release/?query=barcode:${cleanCode}&fmt=json`);
            const dataMusic = await resMusic.json();
            if (dataMusic.releases && dataMusic.releases.length > 0) {
              const rel = dataMusic.releases[0];
              foundTitle = `${rel['artist-credit']?.[0]?.name || ''} - ${rel.title}`;
            }
          } catch (e) {}
        }

        if (foundTitle) {
          inputField.value = foundTitle;
        } else {
          inputField.value = cleanCode;
        }
      },
      () => {}
    ).catch(() => {
      alert("Erreur accès caméra.");
      stopScanner();
    });
  }

  function stopScanner() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
        document.getElementById('scanner-modal').style.display = 'none';
      }).catch(() => {
        document.getElementById('scanner-modal').style.display = 'none';
      });
    } else {
      document.getElementById('scanner-modal').style.display = 'none';
    }
  }

  // --- SAUVEGARDE & RESTAURATION ---
  function exportData() {
    const blob = new Blob([JSON.stringify({ wishlist, collection }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `collection_backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.wishlist && data.collection) {
          wishlist = data.wishlist;
          collection = data.collection;
          saveData();
        }
      } catch (err) { alert("Fichier invalide"); }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if (tab === 'wishlist') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-wishlist').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-collection').classList.add('active');
    }
  }

  // --- RENDU WISHLIST ---
  function renderWishlist() {
    let totalConfirmed = 0, totalPending = 0;
    wishlist.forEach(i => {
      const p = parseFloat(i.price) || 0;
      if (i.status === 'À prendre') totalConfirmed += p;
      if (i.status === 'En réflexion') totalPending += p;
    });

    document.getElementById('totalConfirmed').textContent = formatMoney(totalConfirmed);
    document.getElementById('totalPotential').textContent = formatMoney(totalConfirmed + totalPending);

    const container = document.getElementById('wishlistContainer');
    const platF = document.getElementById('w-filterPlatform').value;
    const statF = document.getElementById('w-filterStatus').value;
    container.innerHTML = '';

    const filtered = wishlist.filter(i => (platF === 'all' || i.platform === platF) && (statF === 'all' || i.status === statF));

    filtered.forEach(item => {
      const index = wishlist.indexOf(item);
      const card = document.createElement('div');
      card.className = 'item-card';
      const dateStr = item.releaseDate ? `📅 ${new Date(item.releaseDate).toLocaleDateString('fr-FR')}` : '📅 Sans date';
      const priceStr = item.price ? formatMoney(item.price) : 'Prix non fixé';

      card.innerHTML = `
        <div class="card-header">
          <div class="item-info">
            <h3>${item.title}</h3>
            <div class="item-meta">
              <span class="badge">${item.platform}</span>
              <span>${priceStr}</span>
              <span>•</span>
              <span>${dateStr}</span>
            </div>
          </div>
          <div class="actions">
            <button class="btn-action btn-transfer" title="Acheté -> Passer en Collection" onclick="moveToCollection(${index})">📥</button>
            <button class="btn-action btn-delete" onclick="deleteWishlistItem(${index})">✕</button>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // --- RENDU COLLECTION ---
  function renderCollection() {
    document.getElementById('collectionCount').textContent = collection.length;
    document.getElementById('collectionItemTotal').textContent = collection.length;

    let totalVal = 0;
    collection.forEach(i => { totalVal += parseFloat(i.price) || 0; });
    document.getElementById('collectionTotalValue').textContent = formatMoney(totalVal);

    const container = document.getElementById('collectionContainer');
    const platF = document.getElementById('c-filterPlatform').value;
    const stateF = document.getElementById('c-filterState').value;
    container.innerHTML = '';

    const filtered = collection.filter(i => (platF === 'all' || i.platform === platF) && (stateF === 'all' || i.state === stateF));

    filtered.forEach(item => {
      const index = collection.indexOf(item);
      const card = document.createElement('div');
      card.className = 'item-card';
      const valStr = item.price ? formatMoney(item.price) : 'Non estimé';

      const query = encodeURIComponent(`${item.title} ${item.platform}`);
      const priceChartingUrl = `https://www.pricecharting.com/search-products?type=prices&q=${query}`;
      const ebaySoldUrl = `https://www.ebay.fr/sch/i.html?_nkw=${query}&LH_Complete=1&LH_Sold=1`;
      const leboncoinUrl = `https://www.leboncoin.fr/recherche?text=${query}`;
      const vintedUrl = `https://www.vinted.fr/catalog?search_text=${query}`;

      card.innerHTML = `
        <div class="card-header">
          <div class="item-info">
            <h3>${item.title}</h3>
            <div class="item-meta">
              <span class="badge">${item.platform}</span>
              <span style="font-weight:600;">${valStr}</span>
            </div>
          </div>
          <div class="actions">
            <select onchange="updateCollectionState(${index}, this.value)" style="padding:4px; font-size:0.75rem; width:auto;">
              <option value="Sous blister / Neuf" ${item.state === 'Sous blister / Neuf' ? 'selected' : ''}>✨ Neuf</option>
              <option value="Pas encore joué / Jamais écouté / Non vu" ${item.state === 'Pas encore joué / Jamais écouté / Non vu' ? 'selected' : ''}>⏳ Non fait</option>
              <option value="En cours / Déjà utilisé" ${item.state === 'En cours / Déjà utilisé' ? 'selected' : ''}>🎮 En cours</option>
              <option value="Terminé / Utilisé" ${item.state === 'Terminé / Utilisé' ? 'selected' : ''}>🏆 Terminé</option>
            </select>
            <button class="btn-action btn-delete" onclick="deleteCollectionItem(${index})">✕</button>
          </div>
        </div>

        <div class="market-links">
          <span style="font-size:0.7rem; color:var(--text-muted);">Argus :</span>
          <a class="btn-market pricecharting" href="${priceChartingUrl}" target="_blank">📈 PriceCharting</a>
          <a class="btn-market" href="${ebaySoldUrl}" target="_blank">📊 eBay</a>
          <a class="btn-market" href="${leboncoinUrl}" target="_blank">🟠 LBC</a>
          <a class="btn-market" href="${vintedUrl}" target="_blank">🟢 Vinted</a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // Wishlist Form
  document.getElementById('wishlistForm').addEventListener('submit', (e) => {
    e.preventDefault();
    wishlist.unshift({
      title: document.getElementById('w-title').value.trim(),
      platform: document.getElementById('w-platform').value,
      price: document.getElementById('w-price').value,
      releaseDate: document.getElementById('w-releaseDate').value,
      status: document.getElementById('w-status').value
    });
    saveData();
    e.target.reset();
  });

  function deleteWishlistItem(index) { wishlist.splice(index, 1); saveData(); }

  function moveToCollection(index) {
    const item = wishlist[index];
    collection.unshift({
      title: item.title,
      platform: item.platform,
      price: item.price || '',
      state: 'Sous blister / Neuf'
    });
    wishlist.splice(index, 1);
    saveData();
    switchTab('collection');
  }

  // Collection Form
  document.getElementById('collectionForm').addEventListener('submit', (e) => {
    e.preventDefault();
    collection.unshift({
      title: document.getElementById('c-title').value.trim(),
      platform: document.getElementById('c-platform').value,
      price: document.getElementById('c-price').value,
      state: document.getElementById('c-state').value
    });
    saveData();
    e.target.reset();
  });

  function updateCollectionState(index, state) { collection[index].state = state; saveData(); }
  function deleteCollectionItem(index) { collection.splice(index, 1); saveData(); }

  document.getElementById('w-filterPlatform').addEventListener('change', renderWishlist);
  document.getElementById('w-filterStatus').addEventListener('change', renderWishlist);
  document.getElementById('c-filterPlatform').addEventListener('change', renderCollection);
  document.getElementById('c-filterState').addEventListener('change', renderCollection);

  saveData();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wishlist & Collection Clay 3D</title>

  <!-- Anti-cache ultime pour PWA iOS -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Manifest PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Collection">

  <!-- Client Officiel Supabase & Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #161922;
      --surface: #202534;
      --surface-elevated: #293043;
      --accent: #9d7fe5;
      --accent-hover: #b39af3;
      --text: #ffffff;
      --text-muted: #9aa4b2;
      
      --clay-pink: #ffb5e8;
      --clay-pink-text: #6b2253;
      --clay-blue: #affcff;
      --clay-blue-text: #0d5c63;
      --clay-yellow: #fdfd96;
      --clay-yellow-text: #615a07;
      --clay-green: #bbf9af;
      --clay-green-text: #1d5214;
      --clay-purple: #e7c6ff;
      --clay-purple-text: #481d66;

      --clay-card: 16px 16px 35px rgba(0, 0, 0, 0.7), -10px -10px 25px rgba(45, 53, 77, 0.5), inset 4px 4px 8px rgba(255, 255, 255, 0.15), inset -4px -4px 8px rgba(0, 0, 0, 0.6);
      --clay-btn: 8px 8px 18px rgba(0, 0, 0, 0.5), -6px -6px 14px rgba(45, 53, 77, 0.4), inset 3px 3px 6px rgba(255, 255, 255, 0.2), inset -3px -3px 6px rgba(0, 0, 0, 0.5);
      --clay-inset: inset 6px 6px 12px rgba(0, 0, 0, 0.7), inset -6px -6px 12px rgba(45, 53, 77, 0.5);
      
      --text-pop: 2px 2px 4px rgba(0, 0, 0, 0.9), -1px -1px 1px rgba(255, 255, 255, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body { 
      /* Ajout des paddings de sécurité pour les iPhones récents (encoche / barre du bas) */
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 24px) 16px; 
      display: flex; 
      justify-content: center;
    }
    
    .container { 
      width: 100%; 
      max-width: 480px;
    }

    /* --- Les styles UI globaux restent identiques --- */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 4px; }
    .header-bar h1 { font-size: 1.5rem; font-weight: 900; color: var(--text); text-shadow: var(--text-pop); letter-spacing: -0.02em; }
    .sync-status { font-size: 0.72rem; font-weight: 800; color: var(--clay-green); display: flex; align-items: center; gap: 4px; }
    .btn-backup { padding: 10px 14px; font-size: 0.78rem; background: var(--surface); border: none; color: var(--text); border-radius: 99px; cursor: pointer; font-weight: 800; text-shadow: var(--text-pop); box-shadow: var(--clay-btn); transition: transform 0.15s; }
    .btn-backup:active { box-shadow: var(--clay-inset); transform: scale(0.96); }

    .tabs { display: flex; background: #12151d; padding: 8px; border-radius: 30px; gap: 8px; margin-bottom: 24px; box-shadow: var(--clay-inset); }
    .tab-btn { flex: 1; padding: 12px 6px; background: transparent; border: none; color: var(--text-muted); border-radius: 22px; font-weight: 800; cursor: pointer; font-size: 0.82rem; text-align: center; transition: all 0.2s ease; }
    .tab-btn.active { background: var(--surface); color: var(--clay-yellow); text-shadow: var(--text-pop); box-shadow: var(--clay-btn); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Statistiques Graphique */
    .chart-container { background: var(--surface); border-radius: 30px; padding: 16px; box-shadow: var(--clay-card); margin-bottom: 20px; }

    /* Cartes 3D Classiques avec Signature Visuelle Collector Unifiée */
    .item-card {
      background: var(--surface);
      border-radius: 30px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      width: 100%;
      box-shadow: var(--clay-card);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      /* Optimisation GPU : Ne rend pas les ombres si l'élément n'est pas à l'écran */
      content-visibility: auto;
      contain-intrinsic-size: 140px;
    }
    .item-card:hover { transform: translateY(-4px); box-shadow: 20px 20px 40px rgba(0, 0, 0, 0.8), -12px -12px 30px rgba(45, 53, 77, 0.6); }
    .item-card.status-take { border-left: 10px solid var(--clay-green); }
    .item-card.status-think { border-left: 10px solid var(--clay-yellow); }
    .item-card.status-pass { border-left: 10px solid var(--clay-pink); }
    .item-card.is-collector { border: 2px solid #f1c40f; box-shadow: 16px 16px 35px rgba(0, 0, 0, 0.7), 0 0 15px rgba(241, 196, 15, 0.25); }

    /* Pour le reste, on conserve ton style pour ne pas casser ton design */
    .item-cover { width: 80px; height: 108px; border-radius: 20px; object-fit: cover; background: var(--bg); flex-shrink: 0; box-shadow: var(--clay-btn); }
    .item-cover-placeholder { width: 80px; height: 108px; border-radius: 20px; background: var(--bg); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: var(--clay-btn); color: var(--text-muted); }
    .item-content { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .item-info { min-width: 0; flex: 1; }
    .item-info h3 { font-size: 1.1rem; font-weight: 900; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 700; }
    
    .badge { padding: 5px 11px; border-radius: 10px; font-size: 0.72rem; background: var(--clay-purple); color: var(--clay-purple-text); font-weight: 900; }
    .badge-collector { padding: 5px 11px; border-radius: 10px; font-size: 0.72rem; background: linear-gradient(135deg, #f39c12 0%, #f1c40f 100%); color: #161922; font-weight: 900; }

    .actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-action { background: var(--bg); border: none; cursor: pointer; padding: 8px 12px; border-radius: 14px; font-size: 0.8rem; box-shadow: var(--clay-btn); color: var(--text-muted); }
    
    .btn-add { background: var(--accent); color: white; border: none; font-weight: 900; padding: 16px; border-radius: 22px; cursor: pointer; box-shadow: var(--clay-btn); width: 100%; margin-top: 10px;}
    .btn-open-add { background: var(--accent); color: white; border: none; font-weight: 900; cursor: pointer; padding: 16px; border-radius: 26px; width: 100%; font-size: 1rem; margin-bottom: 20px; box-shadow: var(--clay-card); }
    
    /* Modals & Forms limitées pour la lisibilité */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10, 12, 18, 0.85); backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center; padding: 16px; padding-bottom: env(safe-area-inset-bottom, 16px); }
    .modal-box { background: var(--surface); border-radius: 36px; width: 100%; max-width: 440px; padding: 26px; display: flex; flex-direction: column; gap: 16px; max-height: 85vh; overflow-y: auto; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9); }
    
    form { display: flex; flex-direction: column; gap: 14px; width: 100%; }
    .form-row { display: flex; gap: 10px; width: 100%; }
    .form-row > * { flex: 1; min-width: 0; }
    input, select, textarea { padding: 14px 16px; border-radius: 20px; border: none; background: var(--bg); color: var(--text); font-size: 0.95rem; width: 100%; box-shadow: var(--clay-inset); }
    
    /* Gachapon Styles */
    .tcg-booster { position: relative; border-radius: 12px; padding: 26px 10px 18px 10px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 320px; box-shadow: 0 18px 40px rgba(0,0,0,0.9); overflow: hidden; }
    .tcg-crimp-top { position: absolute; left: 0; right: 0; height: 22px; background: linear-gradient(90deg, #f39c12 0%, #e67e22 50%, #f1c40f 100%); z-index: 5; top: 0; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 900; color: #161922; touch-action: pan-y; cursor: pointer; }
    .tcg-logo-box { background: rgba(10, 12, 18, 0.9); border: 2px solid rgba(255,255,255,0.35); padding: 10px 18px; border-radius: 14px; font-weight: 900; color: var(--clay-yellow); z-index: 1; }
    .tcg-art-center { font-size: 4.5rem; z-index: 1; }
    
    .booster-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
  </style>
</head>
<body>

<div class="container">

  <!-- Headers et Navigation -->
  <div class="header-bar">
    <div>
      <h1>Bibliothèque Clay 3D</h1>
      <div class="sync-status" id="syncStatus">🟢 Prêt</div>
    </div>
    <div style="display: flex; gap: 6px;">
      <button class="btn-backup" onclick="exportData()">💾 Backup</button>
      <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 Import</button>
      <input type="file" id="importFile" style="display: none;" accept=".json" onchange="importData(event)">
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('wishlist')">🎯 Wishlist</button>
    <button class="tab-btn" onclick="switchTab('collection')">📦 Collection (<span id="collectionCount">0</span>)</button>
    <button class="tab-btn" onclick="switchTab('random')">🎲 Aléatoire</button>
  </div>

  <!-- ONGLETS -->
  <!-- WISHLIST (Structure simplifiée pour l'exemple, garde les champs que tu avais créés pour tes formulaires complets) -->
  <div id="tab-wishlist" class="tab-content active">
    <button type="button" class="btn-open-add" onclick="openAddWishlistModal()">➕ Ajouter un article</button>
    <div id="wishlistContainer"></div>
  </div>

  <!-- COLLECTION -->
  <div id="tab-collection" class="tab-content">
    <button type="button" class="btn-open-add" onclick="openAddCollectionModal()">➕ Ajouter un objet</button>
    
    <!-- Graphique Chart.js -->
    <div class="chart-container">
      <canvas id="collectionChart" width="400" height="200"></canvas>
    </div>

    <div id="collectionContainer"></div>
  </div>

  <!-- GACHAPON -->
  <div id="tab-random" class="tab-content">
    <div style="text-align: center; margin-bottom: 20px;">
      <h2>✨ PLACE DES BOOSTERS ✨</h2>
    </div>
    <div class="booster-grid">
      <div class="tcg-booster" id="booster-game" style="background: linear-gradient(135deg, #0d381b, #175e2f);">
        <div class="tcg-crimp-top" id="crimp-game" onclick="triggerGachaponReveal('game')">TIRER ➔</div>
        <div class="tcg-logo-box">🎮 GAMING</div>
        <div class="tcg-art-center">🕹️</div>
      </div>
    </div>
  </div>

</div>

<!-- LES MODALES DE FORMULAIRE -->
<!-- J'utilise une modale standardisée pour montrer le CRUD. Tu pourras injecter le reste de ton HTML de formulaire à l'intérieur -->
<div id="add-collection-modal" class="modal-overlay">
  <div class="modal-box">
    <h3>Ajouter à la collection</h3>
    <form id="collectionForm" onsubmit="handleCollectionSubmit(event)">
      <input type="text" id="c-title" placeholder="Nom de l'objet possédé..." required>
      <select id="c-platform">
        <option value="PS5">PlayStation 5</option>
        <option value="Switch">Nintendo Switch</option>
        <option value="Vinyle">Vinyle</option>
      </select>
      <input type="number" id="c-price" placeholder="Valeur (€)" step="0.01">
      <select id="c-editionType"><option value="Standard">Standard</option><option value="Collector">Collector</option></select>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn-action" onclick="closeAddCollectionModal()" style="width:50%;">Annuler</button>
        <button type="submit" class="btn-add" style="margin:0; width:50%;">Sauvegarder</button>
      </div>
    </form>
  </div>
</div>

<script>
  // --- CONFIGURATION SUPABASE ---
  const SUPABASE_URL = 'https://bclqthakhybmhdkyyhju.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_GxHaTOPwaJvrkc-qjYfV6w_MsZZyV6X';
  let supabaseClient = null;

  try {
    if (window.supabase) {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }
  } catch (e) {
    console.warn("Supabase non chargé :", e);
  }

  // --- STATE MANAGEMENT ---
  let wishlist = JSON.parse(localStorage.getItem('app_wishlist_cloud_v1')) || [];
  let collection = JSON.parse(localStorage.getItem('app_collection_cloud_v1')) || [];
  
  // Instance du graphique Chart.js
  let collectionChartInstance = null;

  function initApp() {
    // Migration des anciens items sans UUID vers le nouveau système
    wishlist = wishlist.map(item => item.id ? item : { ...item, id: crypto.randomUUID() });
    collection = collection.map(item => item.id ? item : { ...item, id: crypto.randomUUID() });
    
    renderWishlist();
    renderCollection();
    updateChart();

    if (supabaseClient) fetchCloudData();
  }

  // --- NOUVEAU SYSTEME CRUD SUPABASE (Optimisé et Sans Risque) ---
  
  // 1. Fetching des données (Remplacement local si le cloud a des infos)
  async function fetchCloudData() {
    try {
      setSyncStatus('⏳ Sync Cloud...', 'var(--clay-yellow)');
      const [wRes, cRes] = await Promise.all([
        supabaseClient.from('wishlist_items').select('id, data'),
        supabaseClient.from('collection_items').select('id, data')
      ]);

      if (wRes.data) wishlist = wRes.data.map(row => ({ ...row.data, id: row.id }));
      if (cRes.data) collection = cRes.data.map(row => ({ ...row.data, id: row.id }));

      saveDataLocal();
      renderWishlist();
      renderCollection();
      updateChart();
      setSyncStatus('🟢 Cloud Synchronisé', 'var(--clay-green)');
    } catch (e) {
      setSyncStatus('⚠️ Mode Local Actif', 'var(--clay-pink)');
    }
  }

  // 2. Sauvegarde Locale Uniquement
  function saveDataLocal() {
    localStorage.setItem('app_wishlist_cloud_v1', JSON.stringify(wishlist));
    localStorage.setItem('app_collection_cloud_v1', JSON.stringify(collection));
  }

  // 3. Upsert Supabase (Création ou Mise à jour sans supprimer toute la base)
  async function syncItemToCloud(table, item) {
    if (!supabaseClient) return;
    try {
      setSyncStatus('⏳ Syncing...', 'var(--clay-yellow)');
      await supabaseClient.from(table).upsert({ id: item.id, data: item });
      setSyncStatus('🟢 Cloud Synchronisé', 'var(--clay-green)');
    } catch (e) {
      setSyncStatus('⚠️ Erreur Sync', 'var(--clay-pink)');
    }
  }

  // 4. Delete Supabase
  async function deleteItemFromCloud(table, id) {
    if (!supabaseClient) return;
    try {
      await supabaseClient.from(table).delete().eq('id', id);
    } catch (e) {
      console.error("Erreur suppression cloud");
    }
  }

  // --- ACTIONS COLLECTION ---

  function handleCollectionSubmit(e) {
    e.preventDefault();
    const newItem = {
      id: crypto.randomUUID(), // <-- Génération de l'UUID !
      title: document.getElementById('c-title').value.trim(),
      platform: document.getElementById('c-platform').value,
      price: document.getElementById('c-price').value,
      editionType: document.getElementById('c-editionType').value,
      buyDate: new Date().toISOString().slice(0, 10)
    };

    collection.unshift(newItem);
    
    // Sauvegarde en 2 temps : Local direct (immédiat pour l'UI), Cloud en tâche de fond (Upsert)
    saveDataLocal();
    syncItemToCloud('collection_items', newItem);

    closeAddCollectionModal();
    e.target.reset();
    renderCollection();
    updateChart();
  }

  async function deleteCollectionItem(index) {
    const item = collection[index];
    if (confirm(`Supprimer ${item.title} ?`)) {
      collection.splice(index, 1);
      saveDataLocal(); // Maj UI immédiate
      renderCollection();
      updateChart();
      
      // Nettoyage Cloud
      await deleteItemFromCloud('collection_items', item.id);
      // Penser à ajouter ta logique de suppression d'images Storage ici
    }
  }

  // --- UI RENDERING ---

  function renderCollection() {
    const container = document.getElementById('collectionContainer');
    document.getElementById('collectionCount').innerText = collection.length;
    container.innerHTML = '';

    collection.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = `item-card ${item.editionType === 'Collector' ? 'is-collector' : ''}`;
      
      card.innerHTML = `
        <div class="item-cover-placeholder">📦</div>
        <div class="item-content">
          <div class="card-header">
            <div class="item-info">
              <h3>${item.title}</h3>
              <div class="item-meta">
                <span class="badge">${item.platform}</span>
                <span>${item.price ? item.price + ' €' : ''}</span>
              </div>
            </div>
            <div class="actions">
              <button class="btn-action" onclick="deleteCollectionItem(${index})">✕</button>
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function renderWishlist() {
    // Logique identique à Collection pour la Wishlist
  }

  // --- CHART.JS INTEGATION (Nouveau) ---
  function updateChart() {
    const ctx = document.getElementById('collectionChart');
    if (!ctx) return;

    // Agréger les données par plateforme
    const platformStats = {};
    collection.forEach(item => {
      platformStats[item.platform] = (platformStats[item.platform] || 0) + 1;
    });

    const data = {
      labels: Object.keys(platformStats),
      datasets: [{
        label: 'Objets par support',
        data: Object.values(platformStats),
        backgroundColor: ['#9d7fe5', '#affcff', '#fdfd96', '#ffb5e8', '#bbf9af'],
        borderWidth: 0,
        hoverOffset: 4
      }]
    };

    if (collectionChartInstance) {
      collectionChartInstance.data = data;
      collectionChartInstance.update();
    } else {
      collectionChartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: data,
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'right', labels: { color: '#ffffff' } }
          }
        }
      });
    }
  }

  // --- NAVIGATION ET MODALES ---
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if(tab === 'wishlist') { document.querySelectorAll('.tab-btn')[0].classList.add('active'); document.getElementById('tab-wishlist').classList.add('active'); }
    if(tab === 'collection') { document.querySelectorAll('.tab-btn')[1].classList.add('active'); document.getElementById('tab-collection').classList.add('active'); }
    if(tab === 'random') { document.querySelectorAll('.tab-btn')[2].classList.add('active'); document.getElementById('tab-random').classList.add('active'); }
  }

  function setSyncStatus(text, color = 'var(--clay-green)') {
    const el = document.getElementById('syncStatus');
    if (el) { el.textContent = text; el.style.color = color; }
  }

  function openAddCollectionModal() { document.getElementById('add-collection-modal').style.display = 'flex'; }
  function closeAddCollectionModal() { document.getElementById('add-collection-modal').style.display = 'none'; }
  function openAddWishlistModal() { alert("Intègre ton formulaire Wishlist ici"); }
  
  function triggerGachaponReveal(type) { alert("Le Booster s'ouvre ! Implémente le reste de ta logique Gachapon ici."); }

  // Initialisation
  window.addEventListener('DOMContentLoaded', initApp);

</script>
</body>
</html>

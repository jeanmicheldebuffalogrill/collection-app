<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wishlist & Collection Clay 3D</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Collection">

  <!-- Client Officiel Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #161922;
      --surface: #202534;
      --surface-elevated: #293043;
      --accent: #9d7fe5;
      --accent-hover: #b39af3;
      --text: #ffffff;
      --text-muted: #9aa4b2;
      
      --clay-pink: #ffb5e8;
      --clay-pink-text: #6b2253;
      --clay-blue: #affcff;
      --clay-blue-text: #0d5c63;
      --clay-yellow: #fdfd96;
      --clay-yellow-text: #615a07;
      --clay-green: #bbf9af;
      --clay-green-text: #1d5214;
      --clay-purple: #e7c6ff;
      --clay-purple-text: #481d66;

      --clay-card: 16px 16px 35px rgba(0, 0, 0, 0.7), -10px -10px 25px rgba(45, 53, 77, 0.5), inset 4px 4px 8px rgba(255, 255, 255, 0.15), inset -4px -4px 8px rgba(0, 0, 0, 0.6);
      --clay-btn: 8px 8px 18px rgba(0, 0, 0, 0.5), -6px -6px 14px rgba(45, 53, 77, 0.4), inset 3px 3px 6px rgba(255, 255, 255, 0.2), inset -3px -3px 6px rgba(0, 0, 0, 0.5);
      --clay-inset: inset 6px 6px 12px rgba(0, 0, 0, 0.7), inset -6px -6px 12px rgba(45, 53, 77, 0.5);
      
      --text-pop: 2px 2px 4px rgba(0, 0, 0, 0.9), -1px -1px 1px rgba(255, 255, 255, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
    
    html, body {
      max-width: 100%;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body { 
      padding: 24px 16px; 
      display: flex; 
      justify-content: center;
    }
    
    .container { 
      width: 100%; 
      max-width: 480px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 0 4px;
    }
    .header-bar h1 { 
      font-size: 1.5rem; 
      font-weight: 900; 
      color: var(--text);
      text-shadow: var(--text-pop);
      letter-spacing: -0.02em; 
    }
    .sync-status {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--clay-green);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-backup {
      padding: 10px 14px;
      font-size: 0.78rem;
      background: var(--surface);
      border: none;
      color: var(--text);
      border-radius: 99px;
      cursor: pointer;
      font-weight: 800;
      text-shadow: var(--text-pop);
      box-shadow: var(--clay-btn);
      transition: transform 0.15s;
    }
    .btn-backup:active { box-shadow: var(--clay-inset); transform: scale(0.96); }

    /* Onglets 3D */
    .tabs {
      display: flex;
      background: #12151d;
      padding: 8px;
      border-radius: 30px;
      gap: 12px;
      margin-bottom: 24px;
      box-shadow: var(--clay-inset);
    }
    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 22px;
      font-weight: 800;
      cursor: pointer;
      font-size: 0.9rem;
      text-align: center;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      transition: all 0.2s ease;
    }
    .tab-btn.active { 
      background: var(--surface); 
      color: var(--clay-yellow); 
      text-shadow: var(--text-pop);
      box-shadow: var(--clay-btn);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Sélecteur Période / Budget 3D */
    .month-filter-box {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      background: var(--surface);
      padding: 14px 18px;
      border-radius: 26px;
      box-shadow: var(--clay-card);
    }
    .month-filter-box label {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      font-weight: 800;
    }
    .month-filter-box select {
      padding: 10px 14px;
      font-size: 0.85rem;
      background: var(--bg);
      border-radius: 16px;
      border: none;
      color: var(--text);
      font-weight: 800;
      text-shadow: var(--text-pop);
      box-shadow: var(--clay-inset);
    }

    /* Résumés 3D */
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }
    .summary-card {
      background: var(--surface);
      border-radius: 30px;
      padding: 18px;
      text-align: center;
      box-shadow: var(--clay-card);
    }
    .summary-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    .summary-amount { font-size: 1.35rem; font-weight: 900; letter-spacing: -0.01em; text-shadow: var(--text-pop); }
    .amount-confirmed { color: var(--clay-green); }
    .amount-pending { color: var(--clay-yellow); }
    .amount-value { color: var(--clay-purple); }

    /* Répartition par Plateforme */
    .platform-breakdown {
      background: var(--surface);
      border-radius: 30px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: var(--clay-card);
    }
    .platform-breakdown-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .platform-breakdown-title {
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .btn-reset-chip {
      font-size: 0.72rem;
      background: var(--bg);
      border: none;
      color: var(--clay-blue);
      padding: 5px 12px;
      border-radius: 99px;
      cursor: pointer;
      font-weight: 800;
      box-shadow: var(--clay-btn);
    }
    .platform-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .platform-chip {
      background: var(--bg);
      border-radius: 20px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      box-shadow: var(--clay-btn);
      transition: transform 0.15s;
    }
    .platform-chip:active { box-shadow: var(--clay-inset); }
    .platform-chip.active {
      background: var(--clay-purple);
      color: var(--clay-purple-text);
    }
    .platform-chip-name { font-size: 0.76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 800; }
    .platform-chip-value { font-size: 0.95rem; font-weight: 900; color: var(--clay-yellow); margin-top: 2px; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8); }
    .platform-chip-count { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; }

    /* Modals 3D */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 12, 18, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--surface);
      border-radius: 36px;
      width: 100%;
      max-width: 440px;
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 900;
      font-size: 1.15rem;
      text-shadow: var(--text-pop);
    }

    /* Formulaires 3D */
    form {
      background: var(--surface);
      padding: 24px;
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
      width: 100%;
      box-shadow: var(--clay-card);
    }

    .form-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .form-row > * {
      flex: 1;
      min-width: 0;
    }

    input, select, textarea, button {
      padding: 14px 16px;
      border-radius: 20px;
      border: none;
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      box-shadow: var(--clay-inset);
      font-weight: 800;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
    }
    input:focus, select:focus, textarea:focus {
      box-shadow: var(--clay-inset), 0 0 0 3px var(--accent);
    }
    textarea {
      resize: vertical;
      min-height: 75px;
      font-family: inherit;
    }

    .btn-add {
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 900;
      cursor: pointer;
      padding: 16px;
      border-radius: 22px;
      margin-top: 6px;
      text-shadow: var(--text-pop);
      box-shadow: var(--clay-btn);
      transition: transform 0.1s;
    }
    .btn-add:active { box-shadow: var(--clay-inset); transform: scale(0.97); }

    .btn-collector-link {
      background: var(--clay-yellow);
      color: var(--clay-yellow-text);
      border: none;
      font-weight: 900;
      cursor: pointer;
      padding: 12px 14px;
      border-radius: 16px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--clay-btn);
      text-shadow: none;
      font-size: 0.85rem;
      transition: transform 0.1s;
    }
    .btn-collector-link:active { box-shadow: var(--clay-inset); transform: scale(0.97); }

    /* Zone Jaquette Compatible iPhone & Pellicule */
    .image-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg);
      padding: 14px;
      border-radius: 24px;
      box-shadow: var(--clay-inset);
    }
    .image-action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-image-action {
      border: none;
      font-weight: 900;
      cursor: pointer;
      padding: 11px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--clay-btn);
      text-shadow: none;
      text-align: center;
    }
    .btn-image-action:active { box-shadow: var(--clay-inset); transform: scale(0.98); }
    .btn-google { background: var(--clay-blue); color: var(--clay-blue-text); }
    .btn-photos { background: var(--clay-purple); color: var(--clay-purple-text); }

    .image-input-direct {
      width: 100%;
      padding: 12px 14px;
      font-size: 0.85rem;
      background: var(--surface);
      border-radius: 16px;
    }

    .image-preview-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-top: 4px;
    }
    .image-preview-thumb {
      width: 76px;
      height: 102px;
      border-radius: 18px;
      object-fit: cover;
      background: var(--surface);
      cursor: pointer;
      box-shadow: var(--clay-card);
      border: 3px solid var(--surface-elevated);
    }
    .btn-remove-preview {
      background: var(--clay-pink);
      color: var(--clay-pink-text);
      border: none;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      box-shadow: var(--clay-btn);
      width: auto;
    }
    .btn-remove-preview:active { box-shadow: var(--clay-inset); }

    /* Filtres */
    .controls { display: flex; gap: 8px; margin-bottom: 16px; width: 100%; }
    .controls select { flex: 1; padding: 12px; font-size: 0.85rem; background: var(--surface); border-radius: 20px; font-weight: 800; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8); box-shadow: var(--clay-btn); }

    /* Cartes 3D Classiques */
    .item-card {
      background: var(--surface);
      border-radius: 30px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 16px;
      width: 100%;
      box-shadow: var(--clay-card);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .item-card:hover { transform: translateY(-4px); box-shadow: 20px 20px 40px rgba(0, 0, 0, 0.8), -12px -12px 30px rgba(45, 53, 77, 0.6); }
    
    .item-card.status-take { border-left: 10px solid var(--clay-green); }
    .item-card.status-think { border-left: 10px solid var(--clay-yellow); }
    .item-card.status-pass { border-left: 10px solid var(--clay-pink); }

    .item-cover {
      width: 80px;
      height: 108px;
      border-radius: 20px;
      object-fit: cover;
      background: var(--bg);
      flex-shrink: 0;
      box-shadow: var(--clay-btn);
      cursor: pointer;
    }
    .item-cover-placeholder {
      width: 80px;
      height: 108px;
      border-radius: 20px;
      background: var(--bg);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      box-shadow: var(--clay-btn);
      color: var(--text-muted);
    }

    .item-content {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      min-width: 0;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .item-info { min-width: 0; flex: 1; }
    .item-info h3 { 
      font-size: 1.1rem; 
      font-weight: 900;
      margin-bottom: 4px; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      letter-spacing: -0.01em;
      text-shadow: var(--text-pop);
    }
    .item-meta { font-size: 0.78rem; color: var(--text-muted); display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-weight: 700; }
    
    .badge { padding: 5px 11px; border-radius: 10px; font-size: 0.72rem; background: var(--clay-purple); color: var(--clay-purple-text); font-weight: 900; text-shadow: none; box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3); }
    .badge-store { padding: 5px 11px; border-radius: 10px; font-size: 0.72rem; background: var(--clay-green); color: var(--clay-green-text); font-weight: 900; text-shadow: none; box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3); }
    .badge-state { padding: 5px 11px; border-radius: 10px; font-size: 0.72rem; background: var(--bg); color: var(--text); font-weight: 800; text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.8); box-shadow: var(--clay-btn); }
    .badge-play { padding: 5px 11px; border-radius: 10px; font-size: 0.72rem; background: var(--clay-yellow); color: var(--clay-yellow-text); font-weight: 900; text-shadow: none; box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3); }

    .item-note {
      font-size: 0.78rem;
      background: var(--bg);
      padding: 10px 14px;
      border-radius: 14px;
      color: var(--text-muted);
      box-shadow: var(--clay-inset);
      margin-top: 4px;
      font-weight: 700;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.8);
    }

    .market-links {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding-top: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    .btn-market {
      font-size: 0.72rem;
      padding: 6px 12px;
      border-radius: 12px;
      background: var(--bg);
      color: var(--clay-blue);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font-weight: 800;
      text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.8);
      box-shadow: var(--clay-btn);
    }
    .btn-market:active { box-shadow: var(--clay-inset); }
    .btn-market.pricecharting { color: var(--clay-purple); }
    
    .actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .btn-action {
      background: var(--bg);
      border: none;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      width: auto;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      box-shadow: var(--clay-btn);
    }
    .btn-action:active { box-shadow: var(--clay-inset); }
    .btn-edit { color: var(--clay-blue); }
    .btn-delete { color: var(--clay-pink); }

    /* Frise Chronologique en Carrousel Horizontal (Tuiles & Swipe Snap) */
    .timeline-h-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 10px 4px 20px 4px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .timeline-h-container::-webkit-scrollbar {
      height: 8px;
    }
    .timeline-h-container::-webkit-scrollbar-track {
      background: var(--surface);
      border-radius: 99px;
    }
    .timeline-h-container::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 99px;
    }

    /* Carte Tuile Verticale du Carrousel */
    .tile-card {
      background: var(--surface);
      border-radius: 30px;
      padding: 18px;
      min-width: 220px;
      max-width: 220px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-snap-align: center;
      box-shadow: var(--clay-card);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .tile-card:hover {
      transform: translateY(-4px);
    }
    .tile-cover {
      width: 100%;
      height: 270px;
      border-radius: 20px;
      object-fit: cover;
      background: var(--bg);
      box-shadow: var(--clay-btn);
    }
    .tile-cover-placeholder {
      width: 100%;
      height: 270px;
      border-radius: 20px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: var(--clay-btn);
      color: var(--text-muted);
    }
    .tile-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      text-align: center;
    }
    .tile-title {
      font-size: 1rem;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: var(--text-pop);
    }
    .tile-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    /* Fiche détaillée & Galerie */
    .detail-cover-large {
      width: 150px;
      height: 200px;
      border-radius: 26px;
      object-fit: cover;
      background: var(--bg);
      margin: 0 auto;
      cursor: pointer;
      box-shadow: var(--clay-card);
    }
    .detail-gallery-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .gallery-thumb-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
    }
    .gallery-thumb {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      object-fit: cover;
      background: var(--bg);
      cursor: pointer;
      box-shadow: var(--clay-btn);
    }
    .btn-delete-gallery-photo {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--clay-pink);
      color: var(--clay-pink-text);
      border: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--clay-btn);
    }
    .btn-add-photo {
      background: var(--clay-blue);
      color: var(--clay-blue-text);
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-size: 0.82rem;
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
      box-shadow: var(--clay-btn);
    }

    /* Lightbox Plein Écran */
    #lightbox-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(12px);
    }
    #lightbox-img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 30px;
      object-fit: contain;
      box-shadow: var(--clay-card);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Lightbox Plein Écran -->
  <div id="lightbox-modal" onclick="closeLightbox()">

    }
  }

  async function compressImageFile(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_SIZE = 1200;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob((blob) => {
            const compressedFile = new File([blob], file.name || 'image.jpg', {
              type: 'image/jpeg',
              lastModified: Date.now()
            });
            resolve(compressedFile);
          }, 'image/jpeg', 0.82);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function deleteFileFromSupabaseStorage(photoUrl) {
    if (!supabaseClient || !photoUrl || !photoUrl.includes('collection-photos/')) return;
    try {
      const filePath = photoUrl.split('/collection-photos/')[1];
      if (filePath) {
        await supabaseClient.storage
          .from('collection-photos')
          .remove([filePath]);
      }
    } catch (err) {
      console.warn("Impossible de supprimer le fichier du storage distant :", err);
    }
  }

  function handleDirectPaste(e, inputFieldId, wrapId, previewImgId) {
    if (e.clipboardData && e.clipboardData.items) {
      for (const item of e.clipboardData.items) {
        if (item.type.startsWith('image/')) {
          e.preventDefault();
          const file = item.getAsFile();
          compressImageFile(file).then(compressed => {
            uploadDirectFile(compressed, inputFieldId, wrapId, previewImgId);
          });
          return;
        }
      }
    }
  }

  async function uploadDirectFile(file, inputFieldId, wrapId, previewImgId) {
    if (!supabaseClient) {
      alert("Cloud non disponible.");
      return;
    }

    try {
      setSyncStatus('⏳ Compression & Upload...', 'var(--clay-yellow)');
      const filePath = `photo_${Date.now()}_${Math.random().toString(36).substring(2, 8)}.jpg`;

      const { error } = await supabaseClient.storage
        .from('collection-photos')
        .upload(filePath, file, { cacheControl: '3600', upsert: false });

      if (error) throw error;

      const { data: publicUrlData } = supabaseClient.storage
        .from('collection-photos')
        .getPublicUrl(filePath);

      document.getElementById(inputFieldId).value = publicUrlData.publicUrl;
      updateImagePreview(inputFieldId, wrapId, previewImgId);
      setSyncStatus('🟢 Cloud Synchronisé', 'var(--clay-green)');
    } catch (err) {
      alert("Erreur lors de l'envoi de l'image collée.");
      setSyncStatus('⚠️ Erreur upload', 'var(--clay-pink)');
    }
  }

    const file = event.target.files[0];

    if (!supabaseClient) {
      alert("Cloud non disponible.");
      return;
    }

    try {
      setSyncStatus('⏳ Compression & Upload...', 'var(--clay-yellow)');
      const compressed = await compressImageFile(file);
      const filePath = `photo_${Date.now()}_${Math.random().toString(36).substring(2, 8)}.jpg`;

      const { error } = await supabaseClient.storage
        .from('collection-photos')
        .upload(filePath, compressed, { cacheControl: '3600', upsert: false });

      if (error) throw error;

      const { data: publicUrlData } = supabaseClient.storage
        .from('collection-photos')
        .getPublicUrl(filePath);

      document.getElementById(inputFieldId).value = publicUrlData.publicUrl;
      updateImagePreview(inputFieldId, wrapId, previewImgId);
      setSyncStatus('🟢 Cloud Synchronisé', 'var(--clay-green)');
    } catch (err) {
      alert("Erreur lors de l'envoi de l'image.");
      setSyncStatus('⚠️ Erreur upload', 'var(--clay-pink)');
    } finally {
      event.target.value = '';
    }
  }

    if (currentDetailCollectionIndex === null) return;
    const file = event.target.files[0];

    const btn = document.getElementById('btnAddPhotoLabel');
    const oldText = btn ? btn.textContent : '';
    if (btn) btn.textContent = "⏳ Compression & Upload...";

    try {
      setSyncStatus('⏳ Upload Photo...', 'var(--clay-yellow)');
      const compressed = await compressImageFile(file);
      const filePath = `photo_${Date.now()}_${Math.random().toString(36).substring(2, 8)}.jpg`;

      const { error } = await supabaseClient.storage
        .from('collection-photos')
        .upload(filePath, compressed, { cacheControl: '3600', upsert: false });

      if (error) throw error;

      const { data: publicUrlData } = supabaseClient.storage

      const item = collection[currentDetailCollectionIndex];

  async function deleteCollectionPhoto(photoIndex) {
    if (currentDetailCollectionIndex === null) return;
    const item = collection[currentDetailCollectionIndex];

    const wMonthsSet = new Set();
    wishlist.forEach(i => { if (i.releaseDate) wMonthsSet.add(i.releaseDate.substring(0, 7)); });
    
    wMonthSelect.innerHTML = '<option value="all">Tout le calendrier</option><option value="nodate">📅 Sans date fixée</option>';
    Array.from(wMonthsSet).sort().forEach(ym => {
      const [year, month] = ym.split('-');
      const dateObj = new Date(parseInt(year, 10), parseInt(month, 10) - 1, 1);
      const label = dateObj.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const opt = document.createElement('option');
      opt.value = ym;
      opt.textContent = `📅 ${label.charAt(0).toUpperCase() + label.slice(1)}`;
      wMonthSelect.appendChild(opt);
    });
    wMonthSelect.value = Array.from(wMonthSelect.options).some(o => o.value === wCurrentVal) ? wCurrentVal : 'all';

    const cMonthSelect = document.getElementById('c-monthFilter');
    if(!cMonthSelect) return;
    const cCurrentVal = cMonthSelect.value;
    const cMonthsSet = new Set();
    collection.forEach(i => { if (i.buyDate) cMonthsSet.add(i.buyDate.substring(0, 7)); });

    cMonthSelect.innerHTML = '<option value="all">Tout l\'historique</option><option value="nodate">📅 Sans date d\'achat</option>';
    Array.from(cMonthsSet).sort().forEach(ym => {
      const [year, month] = ym.split('-');
      const dateObj = new Date(parseInt(year, 10), parseInt(month, 10) - 1, 1);
      const label = dateObj.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      const opt = document.createElement('option');
      opt.value = ym;
      opt.textContent = `📅 ${label.charAt(0).toUpperCase() + label.slice(1)}`;
      cMonthSelect.appendChild(opt);
    });
    cMonthSelect.value = Array.from(cMonthSelect.options).some(o => o.value === cCurrentVal) ? cCurrentVal : 'all';
  }

  function resetPlatformFilter() {
    document.getElementById('c-filterPlatform').value = 'all';
    renderCollection();
  }

  function exportData() {
    const blob = new Blob([JSON.stringify({ wishlist, collection }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `collection_backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  }

  function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        if (data.wishlist && data.collection) {
          wishlist = data.wishlist;
          collection = data.collection;
          saveData();
        }
      } catch (err) { alert("Fichier invalide"); }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    
    if (tab === 'wishlist') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-wishlist').classList.add('active');
      renderWishlist();
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-collection').classList.add('active');
      renderCollection();
    }
  }

  function renderWishlist() {
    const monthFilter = document.getElementById('w-monthFilter')?.value || 'all';
    const platF = document.getElementById('w-filterPlatform')?.value || 'all';
    const storeF = document.getElementById('w-filterStore')?.value || 'all';
    const statF = document.getElementById('w-filterStatus')?.value || 'all';

    let totalConfirmed = 0, totalPending = 0;

    wishlist.forEach(i => {
      const p = parseFloat(i.price) || 0;
      const itemYM = i.releaseDate ? i.releaseDate.substring(0, 7) : 'nodate';
      const matchMonth = (monthFilter === 'all') || (monthFilter === 'nodate' && !i.releaseDate) || (monthFilter === itemYM);

      if (matchMonth) {
        if (i.status === 'À prendre') totalConfirmed += p;
        if (i.status === 'En réflexion') totalPending += p;
      }
    });

    if(document.getElementById('labelConfirmed')) document.getElementById('labelConfirmed').textContent = monthFilter !== 'all' ? 'Prévu (sélection)' : 'Total prévu';
    if(document.getElementById('labelPotential')) document.getElementById('labelPotential').textContent = monthFilter !== 'all' ? 'Potentiel (sélection)' : 'Total potentiel';

    if(document.getElementById('totalConfirmed')) document.getElementById('totalConfirmed').textContent = formatMoney(totalConfirmed);
    if(document.getElementById('totalPotential')) document.getElementById('totalPotential').textContent = formatMoney(totalConfirmed + totalPending);

    const container = document.getElementById('wishlistContainer');
    if (!container) return;
    container.innerHTML = '';

    const filtered = wishlist.filter(i => {
      const itemYM = i.releaseDate ? i.releaseDate.substring(0, 7) : 'nodate';
      const matchMonth = (monthFilter === 'all') || (monthFilter === 'nodate' && !i.releaseDate) || (monthFilter === itemYM);
      const matchPlat = (platF === 'all' || i.platform === platF);
      const matchStore = (storeF === 'all' || i.store === storeF);
      const matchStat = (statF === 'all' || i.status === statF);

      return matchMonth && matchPlat && matchStore && matchStat;
    });

    filtered.forEach(item => {
      const index = wishlist.indexOf(item);
      const card = document.createElement('div');
      
      let statusClass = item.status === 'En réflexion' ? 'status-think' : item.status === 'Je passe' ? 'status-pass' : 'status-take';
      let badgeStatusClass = item.status === 'En réflexion' ? 'think' : item.status === 'Je passe' ? 'pass' : 'take';
      let statusText = item.status === 'En réflexion' ? '⏳ En réflexion' : item.status === 'Je passe' ? '❌ Je passe' : '✅ Je prends';

      card.className = `item-card ${statusClass}`;
      const dateStr = item.releaseDate ? `📅 ${new Date(item.releaseDate).toLocaleDateString('fr-FR')}` : '📅 Sans date';
      const priceStr = item.price ? formatMoney(item.price) : 'Prix non fixé';
      const storeBadge = (item.store && item.store !== 'Non renseigné') ? `<span class="badge-store">🛒 ${item.store}</span>` : '';

      const coverHtml = item.image 
        ? `<img src="${item.image}" class="item-cover" alt="Jaquette" onclick="event.stopPropagation(); openLightbox(this.src);" onerror="this.outerHTML='<div class=\\'item-cover-placeholder\\'>📦</div>'">`
        : `<div class="item-cover-placeholder">📦</div>`;

      let subtitle = '';
      if (item.platform === 'Vinyle' && item.artist) subtitle = `<div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">${item.artist}</div>`;
      if (item.platform === 'Blu-ray' && item.director) subtitle = `<div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">De ${item.director}</div>`;

      const q = encodeURIComponent(`${item.title} ${item.platform}`);
      const leclercUrl = `https://www.e.leclerc/recherche?q=${q}`;
      const fnacUrl = `https://www.fnac.com/SearchResult/ResultList.aspx?Search=${q}`;
      const amazonUrl = `https://www.amazon.fr/s?k=${q}`;

      let collectorOrDiscogsHtml = item.platform === 'Vinyle'
        ? `<a class="btn-market discogs" href="https://www.discogs.com/fr/search/?q=${encodeURIComponent([item.artist, item.title].filter(Boolean).join(' '))}&type=release&format_exact=Vinyl" target="_blank">🎵 Discogs</a>`
        : `<a class="btn-market collector" href="https://www.google.com/search?q=${encodeURIComponent('site:editioncollector.fr ' + item.title)}" target="_blank">🏆 Collector</a>`;

      card.innerHTML = `
        ${coverHtml}
        <div class="item-content" style="cursor:pointer;" onclick="openEditModal(${index})">
          <div class="card-header">
            <div class="item-info">
              <h3>${item.title}</h3>
              ${subtitle}
              <div class="item-meta">
                <span class="badge">${item.platform}</span>
                <span class="badge-status ${badgeStatusClass}">${statusText}</span>
                ${storeBadge}
                <span>${priceStr}</span>
                <span>•</span>
                <span>${dateStr}</span>
              </div>
            </div>
            <div class="actions" onclick="event.stopPropagation();">
              <button class="btn-action btn-edit" title="Modifier" onclick="openEditModal(${index})">✏️</button>
              <button class="btn-action btn-transfer" title="Transférer en collection" onclick="moveToCollection(${index})">📥</button>
              <button class="btn-action btn-delete" title="Supprimer" onclick="deleteWishlistItem(${index})">✕</button>
            </div>
          </div>

          <div class="market-links" onclick="event.stopPropagation();">
            <span style="font-size:0.7rem; color:var(--text-muted); font-weight:700;">Recherche :</span>
            ${collectorOrDiscogsHtml}
            <a class="btn-market" href="${leclercUrl}" target="_blank">Leclerc</a>
            <a class="btn-market" href="${fnacUrl}" target="_blank">Fnac</a>
            <a class="btn-market" href="${amazonUrl}" target="_blank">Amazon</a>
          </div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function renderCollection() {
    const countEl = document.getElementById('collectionCount');
    if (countEl) countEl.textContent = collection.length;

    const monthFilter = document.getElementById('c-monthFilter')?.value || 'all';
    const currentPlatformFilter = document.getElementById('c-filterPlatform')?.value || 'all';
    const storeF = document.getElementById('c-filterStore')?.value || 'all';
    const stateF = document.getElementById('c-filterState')?.value || 'all';
    const playF = document.getElementById('c-filterGameplay')?.value || 'all';
    const viewMode = document.getElementById('c-viewMode')?.value || 'list';

    const filtersBar = document.getElementById('collectionFiltersBar');
    if (filtersBar) {
      filtersBar.style.display = viewMode.startsWith('timeline') ? 'none' : 'flex';
    }

    const monthItems = collection.filter(i => {
      const itemYM = i.buyDate ? i.buyDate.substring(0, 7) : 'nodate';
      return (monthFilter === 'all') || (monthFilter === 'nodate' && !i.buyDate) || (monthFilter === itemYM);
    });

    const platformStats = {};
    monthItems.forEach(i => {
      const p = i.platform || 'Autre';
      const val = parseFloat(i.price) || 0;
      if (!platformStats[p]) platformStats[p] = { count: 0, total: 0 };
      platformStats[p].count += 1;
      platformStats[p].total += val;
    });

    const breakdownGrid = document.getElementById('platformBreakdownGrid');
    if (breakdownGrid) {
      breakdownGrid.innerHTML = '';
      const sortedPlatforms = Object.keys(platformStats).sort((a, b) => platformStats[b].total - platformStats[a].total);

      if (sortedPlatforms.length === 0) {
        breakdownGrid.innerHTML = '<span style="font-size:0.75rem; color:#64748b;">Aucun objet pour cette période.</span>';
      } else {
        sortedPlatforms.forEach(plat => {
          const data = platformStats[plat];
          const chip = document.createElement('div');
          const isSelected = (currentPlatformFilter === plat);
          
          chip.className = `platform-chip ${isSelected ? 'active' : ''}`;
          chip.onclick = () => {
            document.getElementById('c-filterPlatform').value = (document.getElementById('c-filterPlatform').value === plat) ? 'all' : plat;
            renderCollection();
          };

          chip.innerHTML = `
            <div class="platform-chip-name">${plat} ${isSelected ? '✓' : ''}</div>
            <div class="platform-chip-value">${formatMoney(data.total)}</div>
            <div class="platform-chip-count">${data.count} objet${data.count > 1 ? 's' : ''}</div>
          `;
          breakdownGrid.appendChild(chip);
        });
      }
    }

    const filtered = collection.filter(i => {
      const itemYM = i.buyDate ? i.buyDate.substring(0, 7) : 'nodate';
      const matchMonth = (monthFilter === 'all') || (monthFilter === 'nodate' && !i.buyDate) || (monthFilter === itemYM);
      const matchPlat = (currentPlatformFilter === 'all' || i.platform === currentPlatformFilter);
      const matchStore = (storeF === 'all' || i.store === storeF);
      const matchState = (stateF === 'all' || i.state === stateF);
      const matchPlay = (playF === 'all' || i.gameplay === playF);

      return viewMode.startsWith('timeline') ? matchMonth : (matchMonth && matchPlat && matchStore && matchState && matchPlay);
    });

    let totalVal = 0;
    filtered.forEach(i => { totalVal += parseFloat(i.price) || 0; });
    
    if(document.getElementById('collectionTotalValue')) document.getElementById('collectionTotalValue').textContent = formatMoney(totalVal);
    if(document.getElementById('collectionItemTotal')) document.getElementById('collectionItemTotal').textContent = filtered.length;

    const isFiltered = (monthFilter !== 'all' || currentPlatformFilter !== 'all' || storeF !== 'all' || stateF !== 'all' || playF !== 'all');
    if(document.getElementById('c-labelValue')) document.getElementById('c-labelValue').textContent = isFiltered ? 'Valeur (sélection)' : 'Valeur totale';
    if(document.getElementById('c-labelCount')) document.getElementById('c-labelCount').textContent = isFiltered ? 'Objets (sélection)' : 'Objets possédés';

    const container = document.getElementById('collectionContainer');
    if (!container) return;
    container.innerHTML = '';

    if (viewMode === 'list') {
      filtered.forEach(item => {
        const index = collection.indexOf(item);
        const card = document.createElement('div');
        card.className = 'item-card';
        
        const valStr = item.price ? formatMoney(item.price) : 'Non estimé';
        const storeBadge = (item.store && item.store !== 'Non renseigné') ? `<span class="badge-store">🛒 ${item.store}</span>` : '';
        const stateBadge = item.state ? `<span class="badge-state">${item.state}</span>` : '';
        const playBadge = (item.gameplay && item.gameplay !== 'Non applicable') ? `<span class="badge-play">🎮 ${item.gameplay}</span>` : '';

        const coverHtml = item.image 
          ? `<img src="${item.image}" class="item-cover" alt="Jaquette" onclick="event.stopPropagation(); openLightbox(this.src);" onerror="this.outerHTML='<div class=\\'item-cover-placeholder\\'>📦</div>'">`
          : `<div class="item-cover-placeholder">📦</div>`;

        let subtitle = '';
        if (item.platform === 'Vinyle' && item.artist) subtitle = `<div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">${item.artist}</div>`;
        if (item.platform === 'Blu-ray' && item.director) subtitle = `<div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">De ${item.director}</div>`;

        let datesDisplay = [];
        if (item.releaseDate) datesDisplay.push(`📅 Sortie : ${new Date(item.releaseDate).toLocaleDateString('fr-FR')}`);
        if (item.buyDate) datesDisplay.push(`🛒 Acheté : ${new Date(item.buyDate).toLocaleDateString('fr-FR')}`);
        const datesStr = datesDisplay.length > 0 ? datesDisplay.join(' • ') : '📅 Dates non fixées';

        const noteHtml = item.note ? `<div class="item-note">📝 ${item.note}</div>` : '';
        const query = encodeURIComponent(`${item.title} ${item.platform}`);

        card.innerHTML = `
          ${coverHtml}
          <div class="item-content" onclick="openCollectionDetail(${index})" style="cursor:pointer;">
            <div class="card-header">
              <div class="item-info">
                <h3>${item.title}</h3>
                ${subtitle}
                <div class="item-meta">
                  <span class="badge">${item.platform}</span>
                  ${stateBadge}
                  ${playBadge}
                  ${storeBadge}
                  <span style="font-weight:900; color:var(--clay-yellow); text-shadow:var(--text-pop);">${valStr}</span>
                </div>
                <div class="item-meta" style="margin-top:2px;">
                  <span>${datesStr}</span>
                </div>
                ${noteHtml}
              </div>
              <div class="actions" onclick="event.stopPropagation();">
                <button class="btn-action btn-edit" title="Modifier" onclick="openEditCollectionModal(${index})">✏️</button>
                <button class="btn-action btn-delete" title="Supprimer" onclick="deleteCollectionItem(${index})">✕</button>
              </div>
            </div>

            <div class="market-links" onclick="event.stopPropagation();">
              <span style="font-size:0.7rem; color:var(--text-muted); font-weight:700;">Argus :</span>
              <a class="btn-market pricecharting" href="https://www.pricecharting.com/search-products?type=prices&q=${query}" target="_blank">📈 PriceCharting</a>
              <a class="btn-market" href="https://www.ebay.fr/sch/i.html?_nkw=${query}&LH_Complete=1&LH_Sold=1" target="_blank">📊 eBay</a>
              <a class="btn-market" href="https://www.leboncoin.fr/recherche?text=${query}" target="_blank">🟠 LBC</a>
              <a class="btn-market" href="https://www.vinted.fr/catalog?search_text=${query}" target="_blank">🟢 Vinted</a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    } else {
      const dateKey = (viewMode === 'timeline-release') ? 'releaseDate' : 'buyDate';

      filtered.sort((a, b) => {
        const dateA = a[dateKey] || '9999-12-31';
        const dateB = b[dateKey] || '9999-12-31';
        return dateA.localeCompare(dateB);
      });

      const scrollContainer = document.createElement('div');
      scrollContainer.className = 'timeline-h-container';

      if (filtered.length === 0) {
        scrollContainer.innerHTML = '<span style="font-size:0.8rem; color:var(--text-muted); padding:20px;">Aucun objet pour cette sélection.</span>';
      } else {
        filtered.forEach(item => {
          const index = collection.indexOf(item);
          const tile = document.createElement('div');
          tile.className = 'tile-card';
          tile.onclick = () => openCollectionDetail(index);

          const coverHtml = item.image 
            ? `<img src="${item.image}" class="tile-cover" alt="Jaquette" onerror="this.outerHTML='<div class=\\'tile-cover-placeholder\\'>📦</div>'">`
            : `<div class="tile-cover-placeholder">📦</div>`;

          const priceStr = item.price ? formatMoney(item.price) : '—';
          const itemDate = item[dateKey] ? new Date(item[dateKey]).getFullYear() : 'N/A';

          tile.innerHTML = `
            ${coverHtml}
            <div class="tile-info">
              <div class="tile-title">${item.title}</div>
              <div class="tile-meta">
                <span class="badge" style="font-size:0.65rem; padding:3px 8px;">${item.platform}</span>
                <span style="font-size:0.72rem; font-weight:800; color:var(--clay-blue);">📅 ${itemDate}</span>
              </div>
              <div style="font-size:0.85rem; font-weight:900; color:var(--clay-yellow); margin-top:2px;">${priceStr}</div>
            </div>
          `;
          scrollContainer.appendChild(tile);
        });
      }

      container.appendChild(scrollContainer);
    }
  }

  // Wishlist Submit
  document.getElementById('wishlistForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const platform = document.getElementById('w-platform').value;
    let extraData = { platform };
    if (platform === 'Vinyle') {
      extraData.artist = document.getElementById('w-artist')?.value.trim() || '';
      extraData.edition = document.getElementById('w-edition')?.value.trim() || '';
    } else if (platform === 'Blu-ray') {
      extraData.director = document.getElementById('w-director')?.value.trim() || '';
      extraData.actors = document.getElementById('w-actors')?.value.trim() || '';
    }

    wishlist.unshift({
      title: document.getElementById('w-title').value.trim(),
      price: document.getElementById('w-price').value,
      store: document.getElementById('w-store').value,
      releaseDate: document.getElementById('w-releaseDate').value,
      image: document.getElementById('w-image').value.trim(),
      status: document.getElementById('w-status').value,
      ...extraData
    });
    
    saveData();
    e.target.reset();
    toggleFormFields('w-', document.getElementById('w-platform').value);
    clearImageField('w-image', 'w-preview-wrap', 'w-preview');
  });

  function deleteWishlistItem(index) {
    wishlist.splice(index, 1);
    saveData();
  }

  function moveToCollection(index) {
    const item = wishlist[index];
    const acquisitionDate = item.releaseDate ? item.releaseDate : new Date().toISOString().slice(0, 10);

    collection.unshift({
      title: item.title,
      platform: item.platform,
      price: item.price || '',
      store: item.store || 'Non renseigné',
      state: '✨ Neuf sous blister',
      releaseDate: item.releaseDate || '',
      buyDate: acquisitionDate,
      image: item.image || '',
      note: '',
      photos: [],
      artist: item.artist || '',
      edition: item.edition || '',
      director: item.director || '',
      actors: item.actors || '',
      gameplay: 'Non commencé'
    });
    wishlist.splice(index, 1);
    saveData();
    switchTab('collection');
  }

  // Collection Submit
  document.getElementById('collectionForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = document.getElementById('c-title').value.trim();
    if (!title) return;

    const platform = document.getElementById('c-platform').value;
    let extraData = { platform };
    if (platform === 'Vinyle') {
      extraData.artist = document.getElementById('c-artist')?.value.trim() || '';
      extraData.edition = document.getElementById('c-edition')?.value.trim() || '';
    } else if (platform === 'Blu-ray') {
      extraData.director = document.getElementById('c-director')?.value.trim() || '';
      extraData.actors = document.getElementById('c-actors')?.value.trim() || '';
    } else {
      extraData.gameplay = document.getElementById('c-gameplay')?.value || 'Non commencé';
    }

    collection.unshift({
      title: title,
      price: document.getElementById('c-price').value,
      store: document.getElementById('c-store').value,
      state: document.getElementById('c-state').value,
      releaseDate: document.getElementById('c-releaseDate').value,
      buyDate: document.getElementById('c-buyDate').value,
      image: document.getElementById('c-image').value.trim(),
      note: document.getElementById('c-note').value.trim(),
      photos: [],
      ...extraData
    });

    saveData();
    e.target.reset();
    toggleFormFields('c-', document.getElementById('c-platform').value);
    clearImageField('c-image', 'c-preview-wrap', 'c-preview');
    document.getElementById('c-viewMode').value = 'list';
    renderCollection();
  });

  async function deleteCollectionItem(index) {
    const item = collection[index];
    if (item) {
      if (item.image) {
        await deleteFileFromSupabaseStorage(item.image);
      }
      if (item.photos && item.photos.length > 0) {
        for (const photoUrl of item.photos) {
          await deleteFileFromSupabaseStorage(photoUrl);
        }
      }
    }
    collection.splice(index, 1);
    saveData();
  }

  document.getElementById('w-filterPlatform').addEventListener('change', renderWishlist);
  document.getElementById('w-filterStore').addEventListener('change', renderWishlist);
  document.getElementById('w-filterStatus').addEventListener('change', renderWishlist);

  document.getElementById('c-filterPlatform').addEventListener('change', renderCollection);
  document.getElementById('c-filterStore').addEventListener('change', renderCollection);
  document.getElementById('c-filterState').addEventListener('change', renderCollection);
  document.getElementById('c-filterGameplay').addEventListener('change', renderCollection);

  window.addEventListener('DOMContentLoaded', () => {
    toggleFormFields('w-', document.getElementById('w-platform').value);
    toggleFormFields('c-', document.getElementById('c-platform').value);
    initApp();
  });
</script>

</body>
</html>
